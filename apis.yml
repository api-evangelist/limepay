apis:
- aid: limepay:limepay-payments-api
  name: Limepay Payments API
  description: >-
    REST API for accepting and managing card and BNPL payments — create and pay
    orders, capture or void authorised (pre-auth) transactions, issue refunds,
    save cards as payment sources, and run 3-D Secure and wallet payments
    (Apple Pay / Google Pay). Documented operations include CreateOrder,
    PayOrder, GetOrder, CancelOrder, CreateOrderInvoice, CaptureTransaction,
    CancelUncapturedTransaction, GetTransaction, GetTransactionByOrderId,
    CreateRefund, CreateSavedPayCard and GetPayPlanEligibilityMaxAmount.
    Authenticated with Publishable (frontend) and Secret (server-side) API keys
    sent as Bearer tokens.
  humanURL: https://docs.limepay.com.au/developer-portal/payments/
  baseURL: https://api.limepay.com.au
  tags:
  - Payments
  - Orders
  - Refunds
  - Transactions
  - BNPL
  properties:
  - type: Documentation
    url: https://docs.limepay.com.au/developer-portal/payments/
  - type: APIReference
    url: https://docs.limepay.com.au/developer-portal/api-reference
- aid: limepay:limepay-platform-api
  name: Limepay Platform API
  description: >-
    REST API for platform and marketplace integrations to onboard and manage
    sub-merchants: create platform merchants, merchant bank accounts and
    merchant persons, run KYC/identification, retrieve merchant tokens and
    settlement reports, issue platform refunds, and look up supported
    industries. Documented operations include CreatePlatformMerchant,
    CreatePlatformMerchantBankAccount, CreatePlatformMerchantPerson,
    GetPlatformMerchant, ListPlatformMerchantPerson, GetPlatformSettlementReport,
    GetPlatformSupportedIndustry and CreatePlatformRefund. Authenticated with a
    platform API key passed as a Bearer token.
  humanURL: https://docs.limepay.com.au/developer-portal/platform/
  baseURL: https://api.limepay.com.au
  tags:
  - Platform
  - Marketplace
  - Onboarding
  - KYC
  - Settlement
  properties:
  - type: Documentation
    url: https://docs.limepay.com.au/developer-portal/platform/
  - type: APIReference
    url: https://docs.limepay.com.au/developer-portal/api-reference
- aid: limepay:limepay-checkout
  name: Limepay Checkout
  description: >-
    Embeddable, customisable checkout that merchants drop into a web store (with
    plugins for WooCommerce, Magento, PrestaShop and Salesforce Commerce Cloud)
    to accept card payments and present the pay-in-instalments (BNPL) option,
    controllable via parameters such as hidePayLaterOption. Backed by the
    Payments API for order creation and payment capture.
  humanURL: https://docs.limepay.com.au/developer-portal/checkout-integration/
  tags:
  - Checkout
  - BNPL
  - Embedded Payments
  properties:
  - type: Documentation
    url: https://docs.limepay.com.au/developer-portal/checkout-integration/
