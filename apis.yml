name: Limepay
kind: company
description: >-
  Limepay was a Melbourne-based Australian embedded-payments and white-label
  buy-now-pay-later (BNPL) company that let merchants and platforms accept card
  payments and offer pay-in-instalments through a single drop-in checkout and a
  REST API. Its developer surface covered an embeddable Checkout, a Payments API
  (orders, order-pay, transaction capture/void, refunds, 3-D Secure and wallet
  payments such as Apple Pay and Google Pay), and a Platform API for
  marketplaces to onboard and manage sub-merchants, run KYC/identification, and
  pull settlement reports. Authentication used a Publishable API key for
  frontend/checkout calls, a Secret API key for server-to-server calls, and a
  platform API key for administrative onboarding, all passed as Bearer tokens.
  After a failed 2021 IPO, Limepay was acquired by ASX-listed Spenda in 2024 and
  its product line was continued under the April Solutions brand; the primary
  domain limepay.com.au now redirects to meetapril.com and the docs.limepay.com.au
  developer portal is gated behind a Redocly login. This profile documents
  Limepay's real, historically public API family honestly; no machine-readable
  OpenAPI is currently downloadable.
