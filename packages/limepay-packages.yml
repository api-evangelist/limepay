  Packagist (limepay/* vendor namespace, author support@limepay.com.au) and
  WordPress.org plugin directory (profiles.wordpress.org/limepay). Verified
  first-party by author identity + docs.limepay.com.au homepages. The npm
  "limepay"/"limepay-web" packages and the GitHub "LimePay" org are a DIFFERENT,
  unrelated blockchain/crypto company (Limechain, ethers/ethereum deps) and are
  deliberately EXCLUDED.
notes: >-
  Limepay (Australia) shipped no general-purpose REST client SDK; its first-party
  developer libraries are drop-in e-commerce checkout plugins that wrap the
  Payments API. The company was acquired by Spenda (2024) and continued as April
  Solutions, so these packages are frozen at their final published versions.
